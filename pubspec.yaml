name: splitbalance
description: A Flutter app for managing shared bills with Supabase storage.
publish_to: 'none'
version: 2.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  supabase_flutter: ^2.5.6
  path_provider: ^2.1.1
  http: ^1.2.0
  intl: any
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.2
  package_info_plus: ^5.0.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  # Only used by tool/migrate_from_csv.dart (one-off Drive -> Supabase
  # data migration) - not a runtime dependency of the app.
  csv: ^5.0.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"
    theme_color: "#0175C2"
