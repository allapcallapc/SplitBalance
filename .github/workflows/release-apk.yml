name: Release APK

# Triggered directly by a tag push (e.g. pushed from a developer machine),
# or invoked as a reusable workflow by release-please.yml. Checkout always
# uses the run's own ref (github.ref_name) rather than the "tag" input:
# for a direct tag push that's the tag itself, but when release-please
# calls this the underlying git tag doesn't exist yet - it creates a draft
# release only, and the tag materializes when that release is published,
# which the final step below does itself after attaching the APK. So the
# run's own ref (main, at the commit release-please is releasing) is what
# actually exists to check out.
#
# Publishing (the final step) uses a PAT (RELEASE_PLEASE_TOKEN secret),
# not the default GITHUB_TOKEN: GitHub's loop-prevention rule means a
# release published with the default token wouldn't fire deploy.yml's own
# `release: published` trigger, and deploy.yml needs to run as its own,
# separately-triggered run (scoped to the real tag ref) to satisfy its
# GitHub Pages environment's deployment branch policy.
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Tag/version being released (defaults to the pushed tag when triggered directly)'
        required: false
        type: string
      generate_release_notes:
        description: 'Auto-generate release notes (set false when the release already has notes, e.g. from release-please)'
        required: false
        type: boolean

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Determine version from tag
        id: version
        uses: ./.github/actions/version-from-tag
        with:
          tag: ${{ inputs.tag || github.ref_name }}

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Written inside android/app/ so the relative storeFile path below
        # (resolved by Gradle relative to the app module) finds it.
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }}

      - name: Attach APK and publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: ${{ inputs.generate_release_notes != false }}
          draft: false
