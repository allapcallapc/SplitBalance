name: Keep Supabase staging awake

# Supabase free-tier projects auto-pause after a week of insufficient
# activity. Per Supabase's own docs (Project Pausing guide), that's not
# just "any successful request within 7 days" - it wants "a few user
# requests to the database each day over the previous week". A twice-
# weekly ping (the original schedule here) passed every run but the
# project got paused anyway, so this now pings daily. No secrets needed:
# env/staging.json's URL and anon key are already public (see
# lib/config/supabase_config.dart's doc comment on why that's safe).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping staging Supabase REST endpoint
        run: |
          URL=$(jq -r '.SUPABASE_URL' env/staging.json)
          KEY=$(jq -r '.SUPABASE_ANON_KEY' env/staging.json)
          # The bare /rest/v1/ root returns the full OpenAPI schema, which
          # Supabase's publishable/anon keys are no longer allowed to fetch
          # (401 "Secret API key required"). Query a real table instead -
          # RLS just filters it to zero rows for an anon request, which is
          # enough to prove the project is up.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            "$URL/rest/v1/households?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY") || STATUS=000
          echo "Response status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Unexpected status '$STATUS' pinging staging Supabase project - it may be paused or unreachable"
            exit 1
          fi
