name: Deploy to GitHub Pages

# Triggered by a release being published (not a tag push): release-apk.yml
# is what actually publishes releases (using a PAT so this trigger fires
# at all - see its own comments), and by the time a release is published,
# a real APK build has already succeeded, so gating web deploys on the
# same event keeps both in lockstep. This also means the github-pages
# environment's deployment branch policy evaluates against the real tag
# ref this run is scoped to, not some other branch.
on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Determine version from tag
        id: version
        uses: ./.github/actions/version-from-tag
        with:
          tag: ${{ github.event.release.tag_name }}

      - name: Build web app
        run: |
          flutter build web --base-href "/${{ github.event.repository.name }}/" \
            --build-name=${{ steps.version.outputs.name }}

      - name: List build output
        run: ls -la build/web/
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
