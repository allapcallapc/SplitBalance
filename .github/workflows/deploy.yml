name: Deploy to GitHub Pages

# Triggered directly by a tag push (e.g. pushed from a developer machine),
# or invoked as a reusable workflow by cut-release.yml. It's called
# directly rather than relying on the tag push there to cascade into this
# trigger, because tags pushed using the default GITHUB_TOKEN don't fire
# other workflows' triggers (GitHub's loop-prevention rule).
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Tag to deploy (defaults to the pushed tag when triggered directly)'
        required: false
        type: string

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Determine version from tag
        id: version
        uses: ./.github/actions/version-from-tag
        with:
          tag: ${{ inputs.tag || github.ref_name }}

      - name: Build web app
        run: |
          flutter build web --base-href "/${{ github.event.repository.name }}/" \
            --build-name=${{ steps.version.outputs.name }}
        
      - name: List build output
        run: ls -la build/web/
        continue-on-error: true
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/web'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
