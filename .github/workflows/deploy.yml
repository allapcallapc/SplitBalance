name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get dependencies
        run: flutter pub get

      - name: Determine version from tag
        id: version
        # Strips the leading "v" so the tag (e.g. v2.0.2) becomes the app's
        # version, matching what release-apk.yml embeds in the Android build
        # and what package_info_plus reports via PackageInfo.fromPlatform().
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build web app
        run: |
          flutter build web --base-href "/${{ github.event.repository.name }}/" \
            --build-name=${{ steps.version.outputs.name }}
        
      - name: List build output
        run: ls -la build/web/
        continue-on-error: true
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/web'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
