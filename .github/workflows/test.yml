name: Test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --exclude-tags integration --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Run analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Android unit tests
        run: |
          flutter build apk --debug --target-platform android-arm64
          cd android && ./gradlew :app:testDebugUnitTest

  integration-test:
    # Separate job from `test` above: a flaky/slow Docker startup here should
    # never block the main test signal. Runs the 'integration' tests skipped
    # by the `test` job's --exclude-tags integration - see
    # test/integration/aggregated_calculation_service_integration_test.dart -
    # against a real local Supabase stack (Docker is preinstalled on
    # ubuntu-latest runners, so this needs no extra setup beyond the CLI).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Export local Supabase connection details
        id: supabase
        run: |
          status=$(supabase status -o json)
          echo "Available \`supabase status -o json\` keys: $(echo "$status" | jq -r 'keys | join(", ")')"
          url=$(echo "$status" | jq -r '.API_URL // .api_url // empty')
          key=$(echo "$status" | jq -r '.SERVICE_ROLE_KEY // .service_role_key // .SECRET_KEY // .secret_key // empty')
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Could not find URL/admin key in \`supabase status -o json\` output - see the key list printed above and update the jq filters in this step."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$key" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        env:
          SUPABASE_TEST_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
        run: flutter test --tags integration --run-skipped --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  coverage-report:
    # Combines the lcov output from `test` (hermetic unit/widget tests) and
    # `integration-test` (needs a live local Supabase stack) into one number
    # so the PR comment reflects the whole suite, not just the unit tests.
    # `if: always()` so a red/skipped integration-test (eg. flaky Docker
    # startup) still gets the unit-test coverage reported instead of the
    # whole job being skipped.
    needs: [test, integration-test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout repository
        # genhtml (invoked by the report action below) reads the actual
        # source files the lcov.info paths point at, not just the lcov
        # data - without a checkout it errors with "does not exist".
        # fetch-depth: 0 (full history, not the default shallow depth-1)
        # so the report action can diff against the PR's base branch to
        # compute per-file "changed lines" coverage correctly.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-unit
          path: coverage-unit

      - name: Download integration test coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-integration
          path: coverage-integration

      - name: Install lcov
        # zgosalvez/github-actions-report-lcov shells out to genhtml, and
        # merging two lcov files needs the `lcov` CLI itself - neither is
        # preinstalled on the ubuntu-latest runner image.
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Merge coverage files
        run: |
          mkdir -p coverage
          files=()
          [ -f coverage-unit/lcov.info ] && files+=(coverage-unit/lcov.info)
          [ -f coverage-integration/lcov.info ] && files+=(coverage-integration/lcov.info)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No coverage files were produced by the test or integration-test jobs."
            exit 1
          elif [ ${#files[@]} -eq 1 ]; then
            cp "${files[0]}" coverage/lcov.info
          else
            args=()
            for f in "${files[@]}"; do
              args+=(-a "$f")
            done
            lcov "${args[@]}" -o coverage/lcov.info
          fi

      - name: Report code coverage on PR
        uses: zgosalvez/github-actions-report-lcov@v7
        with:
          coverage-files: coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
