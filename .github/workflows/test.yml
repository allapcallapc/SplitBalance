name: Test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by the lcov-reporter step below to post/update the coverage
      # comment on the PR.
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --exclude-tags integration --coverage

      - name: Report code coverage on PR
        # Only meaningful with a pull_request event - a plain push or
        # workflow_call run has no PR to comment on.
        if: github.event_name == 'pull_request'
        uses: zgosalvez/github-actions-report-lcov@v0
        with:
          coverage-files: coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true

      - name: Run analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Android unit tests
        run: |
          flutter build apk --debug --target-platform android-arm64
          cd android && ./gradlew :app:testDebugUnitTest

  integration-test:
    # Separate job from `test` above: a flaky/slow Docker startup here should
    # never block the main test signal. Runs the 'integration' tests skipped
    # by the `test` job's --exclude-tags integration - see
    # test/integration/aggregated_calculation_service_integration_test.dart -
    # against a real local Supabase stack (Docker is preinstalled on
    # ubuntu-latest runners, so this needs no extra setup beyond the CLI).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Export local Supabase connection details
        id: supabase
        run: |
          status=$(supabase status -o json)
          echo "Available \`supabase status -o json\` keys: $(echo "$status" | jq -r 'keys | join(", ")')"
          url=$(echo "$status" | jq -r '.API_URL // .api_url // empty')
          key=$(echo "$status" | jq -r '.SERVICE_ROLE_KEY // .service_role_key // .SECRET_KEY // .secret_key // empty')
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Could not find URL/admin key in \`supabase status -o json\` output - see the key list printed above and update the jq filters in this step."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$key" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        env:
          SUPABASE_TEST_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
        run: flutter test --tags integration --run-skipped

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
