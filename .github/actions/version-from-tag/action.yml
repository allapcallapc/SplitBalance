name: 'Determine version from tag'
description: >-
  Strips the leading "v" so a pushed tag (e.g. v2.0.2) becomes the app's
  version - this is what gets embedded via --build-name in Flutter builds,
  and what the in-app update checker compares against the GitHub release tag.
outputs:
  name:
    description: 'The tag with its leading "v" stripped, e.g. 2.0.2'
    value: ${{ steps.version.outputs.name }}
runs:
  using: 'composite'
  steps:
    - id: version
      shell: bash
      run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
